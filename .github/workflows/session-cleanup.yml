name: Empty-session cleanup

on:
  pull_request:
    branches: [develop, compass]
    paths:
      - 'src/parlant/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/session-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PARLANT_ENV: test
      PARLANT_DATA_COLLECTION: 'false'
      GEMINI_API_KEY: cleanup-tests-not-a-real-key
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
          enable-cache: true
      - name: Install locked provider adapters for real SDK fixtures
        run: uv sync --frozen --extra gemini --extra anthropic
      - name: Real cleanup, persistence, tunnel and SDK lifecycle regressions
        env:
          PARLANT_HOME: ${{ runner.temp }}/parlant-session-cleanup
          HTTP_PROXY: http://127.0.0.1:1
          HTTPS_PROXY: http://127.0.0.1:1
          NO_PROXY: localhost,127.0.0.1,::1
        run: >-
          uv run --no-sync pytest -q
          tests/core/stable/test_session_cleanup.py
          tests/adapters/tunnels/test_session_cleanup.py
          tests/sdk/test_empty_session_cleanup.py
      - name: Check cleanup types and formatting
        run: |
          uv run --no-sync mypy --follow-imports=silent src/parlant/core/sessions.py src/parlant/core/app_modules/sessions.py src/parlant/core/tunnel_handlers/sessions.py tests/core/stable/test_session_cleanup.py tests/adapters/tunnels/test_session_cleanup.py
          uv run --no-sync ruff check src/parlant/core/sessions.py src/parlant/core/app_modules/sessions.py src/parlant/core/tunnel_handlers/sessions.py tests/core/stable/test_session_cleanup.py tests/adapters/tunnels/test_session_cleanup.py
          uv run --no-sync ruff format --check src/parlant/core/sessions.py src/parlant/core/app_modules/sessions.py src/parlant/core/tunnel_handlers/sessions.py tests/core/stable/test_session_cleanup.py tests/adapters/tunnels/test_session_cleanup.py
